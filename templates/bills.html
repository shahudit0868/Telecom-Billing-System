<!DOCTYPE html>
<html>
<head>

<title>Bills</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<nav class="navbar navbar-dark bg-dark">
<div class="container-fluid">

<span class="navbar-brand">Telecom Billing System</span>

<div>
<a href="/dashboard" class="btn btn-light">Dashboard</a>
<a href="/customers" class="btn btn-light">Customers</a>
<a href="/add_customer" class="btn btn-light">Add Customer</a>
<a href="/logout" class="btn btn-danger">Logout</a>
</div>

</div>
</nav>

<div class="container mt-4">

<h2 class="mb-4">Customer Bills</h2>

<table class="table table-bordered table-striped">

<thead class="table-dark">

<tr>
<th>Bill ID</th>
<th>Customer</th>
<th>Month</th>
<th>Amount</th>
</tr>

</thead>

<tbody>

{% for bill in bills %}

<tr>

<td>{{ bill[0] }}</td>
<td>{{ bill[1] }}</td>
<td>{{ bill[2] }}</td>
<td>₹{{ bill[3] }}</td>

</tr>

{% endfor %}

</tbody>

</table>

</div>

</body>
</html>
