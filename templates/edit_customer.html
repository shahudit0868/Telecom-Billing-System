<!DOCTYPE html>
<html>
<head>

<title>Edit Customer</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<nav class="navbar navbar-dark bg-dark">
<div class="container-fluid">

<span class="navbar-brand">Telecom Billing System</span>

<div>
<a href="/dashboard" class="btn btn-light">Dashboard</a>
<a href="/customers" class="btn btn-light">Customers</a>
<a href="/logout" class="btn btn-danger">Logout</a>
</div>

</div>
</nav>

<div class="container mt-5">

<div class="row justify-content-center">

<div class="col-md-6">

<div class="card">

<div class="card-header bg-warning">
<h4>Edit Customer</h4>
</div>

<div class="card-body">

<form method="POST">

<div class="mb-3">

<label class="form-label">Customer Name</label>

<input type="text"
name="name"
value="{{ customer[1] }}"
class="form-control"
required minlength="2">

</div>

<div class="mb-3">

<label class="form-label">Phone Number</label>

<input type="tel"
name="phone"
value="{{ customer[2] }}"
pattern="[0-9]{10}"
maxlength="10"
class="form-control"
required>

</div>

<div class="mb-3">

<label class="form-label">Plan</label>

<select name="plan_id" class="form-control">

<option value="1">Basic - ₹299</option>
<option value="2">Standard - ₹599</option>
<option value="3">Premium - ₹999</option>

</select>

</div>

<button class="btn btn-warning">Update Customer</button>

<a href="/customers" class="btn btn-secondary">Cancel</a>

</form>

</div>

</div>

</div>

</div>

</div>

</body>
</html>
